<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contatos prontos | Rosebel Lopes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=block" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --pink-50: #fdf2f8;
      --pink-100: #fce7f3;
      --pink-200: #fbcfe8;
      --pink-500: #ec4899;
      --pink-600: #db2777;
      --blue-50: #f0f9ff;
      --blue-100: #e0f2fe;
      --blue-200: #bae6fd;
      --blue-400: #38bdf8;
      --blue-600: #0284c7;
      --tx-main: #0f172a;
      --tx-muted: #64748b;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 50%, #fdf2f8 100%);
      background-attachment: fixed;
      color: var(--tx-main);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }

    /* Header */
    header {
      max-width: 1140px;
      margin: 0 auto;
      padding: 36px 20px 8px;
    }
    h1 {
      font-size: 32px;
      margin: 0;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--tx-main);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1::after {
      content: 'Rosebel · Lopes';
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--pink-100), var(--blue-100));
      color: var(--pink-600);
      border: 1px solid var(--pink-200);
      padding: 4px 12px;
      border-radius: 999px;
    }
    header p {
      color: var(--tx-muted);
      margin: 8px 0 20px;
      font-size: 14px;
      font-weight: 400;
    }

    /* Sticky Search & Filter Bar */
    .bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 20px;
      z-index: 10;
      border-radius: 20px;
      border: 1px solid rgba(224, 242, 254, 0.9);
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.06);
      margin-bottom: 28px;
    }
    .bar input {
      flex: 1;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      padding: 11px 18px;
      border: 1.5px solid #e2e8f0;
      border-radius: 999px;
      background: #ffffff;
      color: var(--tx-main);
      min-width: 200px;
      outline: none;
      transition: all .15s ease;
    }
    .bar input:focus {
      border-color: var(--blue-400);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
    }
    .cnt {
      align-self: center;
      background: linear-gradient(135deg, var(--pink-500), var(--blue-400));
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      padding: 9px 18px;
      border-radius: 999px;
      white-space: nowrap;
      margin-left: auto;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.25);
    }

    /* Main Container & Cards */
    main {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px 80px;
      display: grid;
      gap: 36px;
    }
    .card {
      background: #ffffff;
      color: var(--tx-main);
      border-radius: 28px;
      border: 1px solid rgba(251, 207, 232, 0.6);
      box-shadow: 0 12px 35px -8px rgba(236, 72, 153, 0.07), 0 4px 18px rgba(56, 189, 248, 0.05);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 240px;
      transition: all .2s ease;
    }
    .card:hover {
      box-shadow: 0 16px 45px -8px rgba(236, 72, 153, 0.12), 0 6px 22px rgba(56, 189, 248, 0.08);
      border-color: var(--pink-200);
    }
    .in {
      padding: 34px;
    }
    .tag {
      color: var(--pink-600);
      background: var(--pink-50);
      border: 1px solid var(--pink-200);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--tx-main);
      margin: 4px 0 24px;
    }
    .ls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 24px;
    }

    /* Lead Item Row */
    .it {
      padding: 12px 16px;
      background: #ffffff;
      border: 1.5px solid #f1f5f9;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      transition: all .15s ease;
    }
    .it:hover {
      background: var(--blue-50);
      border-color: var(--blue-200);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.08);
      transform: translateY(-1px);
    }
    .it b {
      font-weight: 700;
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--tx-main);
      font-size: 13.5px;
    }
    .it small {
      color: var(--tx-muted);
      font-size: 11.5px;
      font-weight: 500;
    }
    .ph {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .ph a {
      display: inline-flex;
      align-items: center;
      background: var(--blue-50);
      color: var(--blue-600);
      border: 1px solid var(--blue-200);
      text-decoration: none;
      font-weight: 600;
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 8px;
      transition: all .15s ease;
    }
    .ph a:hover {
      background: var(--blue-400);
      color: #ffffff;
      border-color: var(--blue-400);
    }
    .it input[type="checkbox"] {
      accent-color: var(--pink-500);
      width: 17px;
      height: 17px;
      cursor: pointer;
      border-radius: 4px;
    }
    .it.done {
      opacity: 0.45;
      background: #f8fafc;
    }
    .it.done b span {
      text-decoration: line-through;
    }
    .it.x {
      opacity: 0.35;
    }
    .bd {
      font-size: 9px;
      background: #fee2e2;
      color: #ef4444;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 800;
      font-style: normal;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    /* Side Stat Column (Rosa suave com Azul Claro) */
    .side {
      background: linear-gradient(160deg, #fdf2f8 0%, #f0f9ff 100%);
      color: var(--tx-main);
      padding: 34px 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      border-left: 1px solid var(--pink-100);
    }
    .side span:first-child {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--blue-600);
      font-weight: 700;
    }
    .side span {
      color: var(--tx-muted);
      font-size: 12px;
      font-weight: 500;
    }
    .side strong {
      font-size: 58px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--pink-500), var(--blue-600));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.04em;
    }
    .btn {
      margin-top: 14px;
      background: linear-gradient(135deg, var(--pink-500), var(--blue-400));
      color: #ffffff;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.25);
      transition: all .15s ease;
    }
    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(236, 72, 153, 0.35);
    }
    .nm {
      cursor: pointer;
      border-bottom: 1.5px dashed var(--pink-200);
      transition: color .15s ease;
    }
    .nm:hover {
      color: var(--pink-600);
      border-bottom-style: solid;
      border-bottom-color: var(--pink-500);
    }

    /* Modal Overlay & Card */
    .ov {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .ov.on {
      display: flex;
    }
    .md {
      background: #ffffff;
      color: var(--tx-main);
      border: 1.5px solid var(--pink-100);
      border-radius: 28px;
      max-width: 540px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 30px 70px -10px rgba(236, 72, 153, 0.2);
    }
    .md .tag {
      color: var(--pink-600);
      background: var(--pink-50);
      border: 1px solid var(--pink-200);
    }
    .md h3 {
      margin: 6px 0 16px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--tx-main);
    }
    .md textarea {
      width: 100%;
      height: 210px;
      background: #fdfefe;
      color: var(--tx-main);
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      padding: 16px;
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .md textarea:focus {
      border-color: var(--blue-400);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
    }
    .ac {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
      align-items: center;
    }
    .ac .btn {
      margin: 0;
    }
    .btn#mv {
      background: var(--blue-50);
      border: 1px solid var(--blue-200);
      color: var(--blue-600);
      box-shadow: none;
    }
    .btn#mv:hover {
      background: var(--blue-100);
    }
    .btn#mc {
      background: linear-gradient(135deg, var(--pink-500), #f43f5e);
      color: #ffffff;
    }
    .btn.w {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
    }
    .btn.w:hover {
      background: #059669;
    }
    .btn#mx {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
      box-shadow: none;
    }
    .btn#mx:hover {
      background: #e2e8f0;
    }
    .hide {
      display: none !important;
    }

    @media (max-width: 760px) {
      .card {
        grid-template-columns: 1fr;
      }
      .side {
        flex-direction: row;
        align-items: center;
        border-left: 0;
        border-top: 1px solid var(--pink-100);
        justify-content: space-between;
        padding: 22px 26px;
      }
      .side strong {
        font-size: 40px;
      }
      .ls {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 24px;
      }
      .bar input {
        width: 100%;
        min-width: 0;
      }
      .cnt {
        margin-left: 0;
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Contatos prontos</h1>
    <p>57 contatos · toque no nome para ver a mensagem, no número para chamar no WhatsApp e marque quem já ligou</p>
    <div class="bar">
      <input id="q" placeholder="Buscar nome ou telefone">
      <a href="calculadora/index.html" target="_blank" style="display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#0d213f,#2563eb);color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;box-shadow:0 6px 16px rgba(37,99,235,0.25);white-space:nowrap;">
        🏠 Simulador Imobiliário & SAC
      </a>
      <span class="cnt" id="n"></span>
    </div>
  </header>

  <main id="m"></main>

  <div class="ov" id="ov">
    <div class="md">
      <div class="tag" id="mtag">Mensagem pronta</div>
      <h3 id="mh"></h3>
      <textarea id="mt"></textarea>
      <div class="ac">
        <button class="btn" id="mv">Outra versão ↻</button>
        <button class="btn" id="mc">Copiar</button>
        <a class="btn w" id="mw" target="_blank" style="text-decoration:none">Chamar no WhatsApp →</a>
        <button class="btn" id="mx" style="margin-left:auto">Fechar</button>
      </div>
    </div>
  </div>

  <script>
  const P={HB:'Home Boutique By Living - Anália Franco',GE:'The Gardens Eleya',GD:'Gran Diálogo Parque Da Mooca',PP:'Pátio Penha',LK:'Lucky - Praça Sílvio Romero',CS:'Club Station Parque Vila Ema',UE:'Universo Tatuapé - Esfera',RT:'Raízes Tatuapé',TG:'Trya Gamaro',VT:'Vista Tatuapé Boulevard',UO:'Universo Tatuapé - Órbita',TZ:'Terrazzo',AT:'Alameda Tatuapé Clube Residences',EG:'Edro Gamaro',TV:'Teg Vila Carrão',QD:'Quadra Diálogo Home Club',BV:'Bella Vita Mooca Home Clube',UA:'Universo Tatuapé - Astro',PV:'Parque Diálogo Vila Ema Residences',HR:'Home Resort Penha',GS:'Gran Spot',PD:'Praça Diálogo Patriarca',MM:'Monã Mooca',AU:'Auge Resort Tatuapé',OC:'Oásis Condomínio Clube - Vila Guilhermina',UR:'Urman São Paulo',PR:'Prisma Condomínio Clube Vila Ema',VI:'Vitrine Tatuapé Condomínio Clube'};
  const O={PL:'Portal Lopes',FB:'Facebook',SMS:'SMS',EM:'E-mail',WPP:'WhatsApp',ST:'Stand',IC:'Imóvel compartilhado'};

  // Lista Ativa: 57 contatos de prospecção direta
  const L=[
  {t:'Contatos prontos',s:'Prospecção direta',g:1,d:`||Joneas Alves Guedes|11949217407
||Orlando Paula Maciel|11989861384
||Fernando Martins|11991294968
||Jose Carlos Barros Dopaso|11982369896
||Maria Cristina Tamisari Ferreira|11988207979
||Luciana Graziela Ferreira dos Santos|11995784836
||Julio Dinis Stocco Neto|11999314378
||Jaqueline Keiko Sato|11981123992
||Edhino Santos Junior|11960730632
||Marcio Abachioni|11975015647
||Silvestre da Costa|11996255466
||Siomara Vidal Moita Pelakauskas|11992591534
||Mauro Antonio Forcetto|11997726593
||Vilma Narvaes de Oliveira|11981839827
||Francisco Reginaldo Fernandes Medeiros|11972279845
||Antonio Vanderlei Toledo|11995211376
||Silvana Pereira Cavalcanti|11975112207
||Alessandro de Aveiro Navarro|11986440994
||Raimunda Holanda Xavier|11965622270
||Paulo Sergio Cancian|11989845562
||Rosilda Maria da Silva|11976261960
||Wagner Luiz Calfa|11950387161
||Reinaldo Rodrigues de Lima|11999320837
||Romario Garcia dos Santos|11943564022
||Airton David Sisti Costa|11994669700
||Jose Sabino Veras|11941228062
||Geraldo Morandim|11957798494
||Airton Luis Alvares|11967520521
||Beatriz Solange de Mello de Vita|11960939632
||Regiani Aparecida Munin|11982561400
||Jose Kulcsar|11972253386
||Rinaldo Marques de Almeida|11993519466
||Silvio de Souza Seccato|11998445302
||Antonio di Gioia|11982731072
||Jose Maria de Oliveira Dorta|11991297234
||Roberta Tatiane de Castro Gomes|11963700657
||Sidnei Conti|11999929613
||Carlos Avanian|11997445465
||Marcos Antonio Felix de Oliveira|11976291627
||Maria Elisabete Campos Frois Silva|11994813772
||Jose Eduardo Xavier Lopes|11992626902
||Italo Ferreira de Sousa|11999639406
||Rogerio Zambonini|11947917820
||Reinaldo dos Santos|11994294947
||Maria Aparecida Lazaro|11998112011
||Luis Antonio Camargo|11997292415
||Wilson Gomes Ferreira|11964950091
||Jair Eduardo de Campos|11986281306
||Arlindo Alves da Silva|11972769680
||Gilda Sumiko Umebayashi|11995368335
||Valmir Madazio|11999429068
||Wagner Medeiros Alexandre|11966010083
||Mario Badia Morillo|11998948177
||Marcia Helena de Sousa Venturin|11950408718
||Sebastiao Roberto Neto|11965347609
||Andre Luiz de Morais Mota|11999613225
||Francisco Monteiro|11999840541`}
  ];

  /* 
  // LISTAS ANTERIORES DESATIVADAS TEMPORARIAMENTE (salvas em leads.html e rosebel-original.html):
  // Lista 1 a 6 com empreendimentos
  */

  const fmt=n=>n.length==11?`(${n.slice(0,2)}) ${n[2]} ${n.slice(3,7)}-${n.slice(7)}`:n.length==10?`(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`:n;
  const lk=n=>n.length==11?`https://wa.me/55${n}`:`tel:${n}`;
  const st=JSON.parse(localStorage.getItem('rosebel_contatos')||localStorage.getItem('rosebel')||'{}'),seen={};let tot=0;
  const m=document.getElementById('m');

  L.forEach((l,li)=>{
    const rows=l.d.split('\n').map(r=>r.split('|'));
    tot+=rows.length;
    const its=rows.map((r,i)=>{
      const id=li+'-'+i,[o,p,nm,a,b,k]=r,key=nm.toLowerCase()+(a||b),dup=seen[key];
      seen[key]=1;
      const ph=[a,b].filter(Boolean).map(t=>`<a href="${lk(t)}" target="_blank">${fmt(t)}</a>`).join('')||'<small>sem telefone</small>';
      return `<div class="it ${k=='x'?'x':''} ${st[id]?'done':''}" data-id="${id}" data-s="${(nm+a+b+(P[p]||'')+(O[o]||'')).toLowerCase()}" data-p="${p||''}" data-o="${o||''}" data-ph="${[a,b].find(t=>t&&t.length==11)||''}"><b><input type="checkbox" ${st[id]||k=='ok'?'checked':''}><span class="nm" title="Ver mensagem">${nm}</span>${dup?'<i class="bd">REPETIDO</i>':''}</b><small>${p?P[p]+' · '+O[o]:'Contato direto · Prospecção'}</small><div class="ph">${ph}</div></div>`
    }).join('');

    m.insertAdjacentHTML('beforeend',`<section class="card"><div class="in"><div class="tag">${l.g?'':'Rosebel LN · 05/11/26'}${l.s?(l.g?'':' · ')+l.s:''}</div><h2>${l.t}</h2><div class="ls">${its}</div></div><aside class="side"><span>Status da lista</span><span style="color:var(--tx-main);font-size:14px;font-weight:700;line-height:1.35">Prontos para o WhatsApp</span><strong>${rows.length}</strong><span>contatos nesta lista</span><button class="btn" onclick="this.closest('.card').querySelector('.it').scrollIntoView({behavior:'smooth',block:'center'})">Ver lista →</button></aside></section>`);
  });

  const f={value:''},o={value:''},q=document.getElementById('q'),n=document.getElementById('n');

  function run(){
    const t=q.value.toLowerCase().trim();
    let c=0;
    document.querySelectorAll('.it').forEach(e=>{
      const ok=(!t||e.dataset.s.includes(t))&&(!f.value||e.dataset.p==f.value)&&(!o.value||e.dataset.o==o.value);
      e.classList.toggle('hide',!ok);
      if(ok)c++;
    });
    document.querySelectorAll('.card').forEach(s=>s.classList.toggle('hide',!s.querySelector('.it:not(.hide)')));
    n.textContent=c+' de '+tot+' contatos';
  }

  [q].forEach(e=>e.addEventListener('input',run));
  run();

  m.addEventListener('change',e=>{
    const it=e.target.closest('.it');
    if(!it)return;
    st[it.dataset.id]=e.target.checked;
    it.classList.toggle('done',e.target.checked);
    try{localStorage.setItem('rosebel_contatos',JSON.stringify(st))}catch(_){}
  });

  // Copys com empreendimento específico
  const T=[
  (n,e)=>`Oi, ${n}! Aqui é a Rosebel, da Lopes. 😊\n\nVi seu interesse no ${e} e separei pra você a tabela atualizada + uma simulação sob medida, grátis e sem compromisso.\n\nPosso te enviar agora? Responde só *SIM* que eu mando em 1 minuto. 🏡`,
  (n,e)=>`${n}, tudo bem? Rosebel, da Lopes. ☀️\n\nQuero te mostrar o que a maioria só descobre na visita: como a parcela do ${e} pode caber no seu bolso. Faço uma simulação rápida pra você, sem custo.\n\nMelhor pra você hoje: *manhã* ou *tarde*?`,
  (n,e)=>`Oi, ${n}! Rosebel, corretora da Lopes. 😉\n\nAinda está de olho em apartamento? Posso te mandar planta, valores e as unidades disponíveis do ${e} em 1 minuto, sem compromisso.\n\nPrefere receber por aqui ou uma ligação rápida? Responde *1* (aqui) ou *2* (ligação).`
  ];

  // Copys para prospecção direta (sem empreendimento específico)
  const T2=[
  n=>`Oi, ${n}! Aqui é a Rosebel, corretora da Lopes. 😊\n\nTrabalho com imóveis em São Paulo e queria saber: você está pensando em comprar, trocar ou investir em algum apartamento este ano?\n\nSe sim, te mando opções com valores e simulação, sem compromisso. Responde *SIM* que eu envio. Se preferir não receber, é só avisar.`,
  n=>`${n}, tudo bem? Rosebel, da Lopes. ☀️\n\nTenho boas opções de apartamentos na zona leste, com planta, valores e condições atualizadas. Posso te mandar uma seleção rápida, sem compromisso?\n\nResponde *QUERO VER* e eu envio. Se não for o momento, me avise que eu não incomodo mais. 🙂`,
  n=>`Oi, ${n}! Rosebel, corretora da Lopes. 😉\n\nPergunta rápida: o que faria mais sentido pra você hoje? *1* morar, *2* investir ou *3* só olhando.\n\nCom a sua resposta eu te mando só o que vale a pena ver. Se não quiser receber, é só avisar.`
  ];

  const VL=[
    'Versão 1 · Reciprocidade (SIM)',
    'Versão 2 · Curiosidade (Manhã / Tarde)',
    'Versão 3 · Qualificação (1 ou 2)'
  ];

  const VL2=[
    'Versão 1 · Intenção de compra (SIM)',
    'Versão 2 · Seleção Zona Leste (QUERO VER)',
    'Versão 3 · Qualificação rápida (1, 2 ou 3)'
  ];

  let cur=null;
  const ov=document.getElementById('ov'),mt=document.getElementById('mt'),mw=document.getElementById('mw'),mtag=document.getElementById('mtag');

  function show(){
    const{fn,e,v}=cur;
    const idx = (v % 3 + 3) % 3;
    mt.value=e ? T[idx](fn,e) : T2[idx](fn);
    if(mtag) mtag.textContent = e ? VL[idx] : VL2[idx];
    const ph=cur.it.dataset.ph;
    mw.style.display=ph?'':'none';
    upd();
  }
  function upd(){
    const ph=cur.it.dataset.ph;
    if(ph)mw.href='https://wa.me/55'+ph+'?text='+encodeURIComponent(mt.value);
  }

  m.addEventListener('click',ev=>{
    if(!ev.target.classList.contains('nm'))return;
    const it=ev.target.closest('.it'),nm=ev.target.textContent,w=(nm.match(/^\p{L}+/u)||[nm])[0];
    cur={it,fn:w[0].toUpperCase()+w.slice(1).toLowerCase(),e:(P[it.dataset.p]||'').split(' - ')[0],v:[...nm].reduce((a,c)=>a+c.charCodeAt(0),0)%3};
    document.getElementById('mh').textContent=nm;
    document.getElementById('mc').textContent='Copiar';
    show();
    ov.classList.add('on');
  });

  mt.addEventListener('input',upd);
  document.getElementById('mv').onclick=()=>{cur.v++;show()};
  document.getElementById('mc').onclick=async function(){
    try{await navigator.clipboard.writeText(mt.value)}catch(_){mt.select();document.execCommand('copy')}
    this.textContent='Copiado ✓';
  };
  const cl=()=>ov.classList.remove('on');
  document.getElementById('mx').onclick=cl;
  ov.addEventListener('click',ev=>{if(ev.target===ov)cl()});
  addEventListener('keydown',ev=>{if(ev.key=='Escape')cl()});
  </script>
</body>
</html>
