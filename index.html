  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leads Rosebel | Lopes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=block" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --pink-50: #fdf2f8;
      --pink-100: #fce7f3;
      --pink-200: #fbcfe8;
      --pink-500: #ec4899;
      --pink-600: #db2777;
      --blue-50: #f0f9ff;
      --blue-100: #e0f2fe;
      --blue-200: #bae6fd;
      --blue-400: #38bdf8;
      --blue-600: #0284c7;
      --tx-main: #0f172a;
      --tx-muted: #64748b;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 50%, #fdf2f8 100%);
      background-attachment: fixed;
      color: var(--tx-main);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }

    /* Header */
    header {
      max-width: 1140px;
      margin: 0 auto;
      padding: 36px 20px 8px;
    }
    h1 {
      font-size: 32px;
      margin: 0;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--tx-main);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1::after {
      content: 'Rosebel · Lopes';
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--pink-100), var(--blue-100));
      color: var(--pink-600);
      border: 1px solid var(--pink-200);
      padding: 4px 12px;
      border-radius: 999px;
    }
    header p {
      color: var(--tx-muted);
      margin: 8px 0 20px;
      font-size: 14px;
      font-weight: 400;
    }

    /* Sticky Search & Filter Bar */
    .bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 20px;
      z-index: 10;
      border-radius: 20px;
      border: 1px solid rgba(224, 242, 254, 0.9);
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.06);
      margin-bottom: 28px;
    }
    .bar input, .bar select {
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      padding: 11px 18px;
      border: 1.5px solid #e2e8f0;
      border-radius: 999px;
      background: #ffffff;
      color: var(--tx-main);
      min-width: 200px;
      outline: none;
      transition: all .15s ease;
    }
    .bar input {
      flex: 1;
    }
    .bar input:focus, .bar select:focus {
      border-color: var(--blue-400);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
    }
    .cnt {
      align-self: center;
      background: linear-gradient(135deg, var(--pink-500), var(--blue-400));
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      padding: 9px 18px;
      border-radius: 999px;
      white-space: nowrap;
      margin-left: auto;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.25);
    }

    /* Main Container & Cards */
    main {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px 80px;
      display: grid;
      gap: 36px;
    }
    .card {
      background: #ffffff;
      color: var(--tx-main);
      border-radius: 28px;
      border: 1px solid rgba(251, 207, 232, 0.6);
      box-shadow: 0 12px 35px -8px rgba(236, 72, 153, 0.07), 0 4px 18px rgba(56, 189, 248, 0.05);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 240px;
      transition: all .2s ease;
    }
    .card:hover {
      box-shadow: 0 16px 45px -8px rgba(236, 72, 153, 0.12), 0 6px 22px rgba(56, 189, 248, 0.08);
      border-color: var(--pink-200);
    }
    .in {
      padding: 34px;
    }
    .tag {
      color: var(--pink-600);
      background: var(--pink-50);
      border: 1px solid var(--pink-200);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--tx-main);
      margin: 4px 0 24px;
    }
    .ls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 24px;
    }

    /* Lead Item Row */
    .it {
      padding: 12px 16px;
      background: #ffffff;
      border: 1.5px solid #f1f5f9;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      transition: all .15s ease;
    }
    .it:hover {
      background: var(--blue-50);
      border-color: var(--blue-200);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.08);
      transform: translateY(-1px);
    }
    .it b {
      font-weight: 700;
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--tx-main);
      font-size: 13.5px;
    }
    .it small {
      color: var(--tx-muted);
      font-size: 11.5px;
      font-weight: 500;
    }
    .ph {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .ph a {
      display: inline-flex;
      align-items: center;
      background: var(--blue-50);
      color: var(--blue-600);
      border: 1px solid var(--blue-200);
      text-decoration: none;
      font-weight: 600;
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 8px;
      transition: all .15s ease;
    }
    .ph a:hover {
      background: var(--blue-400);
      color: #ffffff;
      border-color: var(--blue-400);
    }
    .it input[type="checkbox"] {
      accent-color: var(--pink-500);
      width: 17px;
      height: 17px;
      cursor: pointer;
      border-radius: 4px;
    }
    .it.done {
      opacity: 0.45;
      background: #f8fafc;
    }
    .it.done b span {
      text-decoration: line-through;
    }
    .it.x {
      opacity: 0.35;
    }
    .bd {
      font-size: 9px;
      background: #fee2e2;
      color: #ef4444;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 800;
      font-style: normal;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    /* Side Stat Column (Rosa suave com Azul Claro) */
    .side {
      background: linear-gradient(160deg, #fdf2f8 0%, #f0f9ff 100%);
      color: var(--tx-main);
      padding: 34px 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      border-left: 1px solid var(--pink-100);
    }
    .side span:first-child {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--blue-600);
      font-weight: 700;
    }
    .side span {
      color: var(--tx-muted);
      font-size: 12px;
      font-weight: 500;
    }
    .side strong {
      font-size: 58px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--pink-500), var(--blue-600));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.04em;
    }
    .btn {
      margin-top: 14px;
      background: linear-gradient(135deg, var(--pink-500), var(--blue-400));
      color: #ffffff;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.25);
      transition: all .15s ease;
    }
    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(236, 72, 153, 0.35);
    }
    .nm {
      cursor: pointer;
      border-bottom: 1.5px dashed var(--pink-200);
      transition: color .15s ease;
    }
    .nm:hover {
      color: var(--pink-600);
      border-bottom-style: solid;
      border-bottom-color: var(--pink-500);
    }

    /* Modal Overlay & Card */
    .ov {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .ov.on {
      display: flex;
    }
    .md {
      background: #ffffff;
      color: var(--tx-main);
      border: 1.5px solid var(--pink-100);
      border-radius: 28px;
      max-width: 540px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 30px 70px -10px rgba(236, 72, 153, 0.2);
    }
    .md .tag {
      color: var(--pink-600);
      background: var(--pink-50);
      border: 1px solid var(--pink-200);
    }
    .md h3 {
      margin: 6px 0 16px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--tx-main);
    }
    .md textarea {
      width: 100%;
      height: 210px;
      background: #fdfefe;
      color: var(--tx-main);
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      padding: 16px;
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .md textarea:focus {
      border-color: var(--blue-400);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
    }
    .ac {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
      align-items: center;
    }
    .ac .btn {
      margin: 0;
    }
    .btn#mv {
      background: var(--blue-50);
      border: 1px solid var(--blue-200);
      color: var(--blue-600);
      box-shadow: none;
    }
    .btn#mv:hover {
      background: var(--blue-100);
    }
    .btn#mc {
      background: linear-gradient(135deg, var(--pink-500), #f43f5e);
      color: #ffffff;
    }
    .btn.w {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
    }
    .btn.w:hover {
      background: #059669;
    }
    .btn#mx {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
      box-shadow: none;
    }
    .btn#mx:hover {
      background: #e2e8f0;
    }
    .hide {
      display: none !important;
    }

    @media (max-width: 760px) {
      .card {
        grid-template-columns: 1fr;
      }
      .side {
        flex-direction: row;
        align-items: center;
        border-left: 0;
        border-top: 1px solid var(--pink-100);
        justify-content: space-between;
        padding: 22px 26px;
      }
      .side strong {
        font-size: 40px;
      }
      .ls {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 24px;
      }
      .bar input, .bar select {
        width: 100%;
        min-width: 0;
      }
      .cnt {
        margin-left: 0;
        width: 100%;
        text-align: center;
      }
    }
  </style>

  const fmt=n=>n.length==11?`(${n.slice(0,2)}) ${n[2]} ${n.slice(3,7)}-${n.slice(7)}`:n.length==10?`(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`:n;
  const lk=n=>n.length==11?`https://wa.me/55${n}`:`tel:${n}`;
  const st=JSON.parse(localStorage.getItem('rosebel')||'{}'),seen={};let tot=0;
  const m=document.getElementById('m');

  L.forEach((l,li)=>{
    const rows=l.d.split('\n').map(r=>r.split('|'));
    tot+=rows.length;
    const its=rows.map((r,i)=>{
      const id=li+'-'+i,[o,p,nm,a,b,k]=r,key=nm.toLowerCase()+(a||b),dup=seen[key];
      seen[key]=1;
      const ph=[a,b].filter(Boolean).map(t=>`<a href="${lk(t)}" target="_blank">${fmt(t)}</a>`).join('')||'<small>sem telefone</small>';
      return `<div class="it ${k=='x'?'x':''} ${st[id]?'done':''}" data-id="${id}" data-s="${(nm+a+b+P[p]+O[o]).toLowerCase()}" data-p="${p}" data-o="${o}" data-ph="${[a,b].find(t=>t&&t.length==11)||''}"><b><input type="checkbox" ${st[id]||k=='ok'?'checked':''}><span class="nm" title="Ver mensagem">${nm}</span>${dup?'<i class="bd">REPETIDO</i>':''}</b><small>${P[p]} · ${O[o]}</small><div class="ph">${ph}</div></div>`
    }).join('');

    const top=Object.entries(rows.reduce((c,r)=>(c[r[1]]=(c[r[1]]||0)+1,c),{})).sort((a,b)=>b[1]-a[1])[0][0];

    m.insertAdjacentHTML('beforeend',`<section class="card"><div class="in"><div class="tag">Rosebel LN · 05/11/26${l.s?' · '+l.s:''}</div><h2>${l.t}</h2><div class="ls">${its}</div></div><aside class="side"><span>Mais frequente</span><span style="color:var(--tx-main);font-size:13.5px;font-weight:700;line-height:1.35">${P[top]}</span><strong>${rows.length}</strong><span>leads nesta lista</span><button class="btn" onclick="this.closest('.card').querySelector('.it').scrollIntoView({behavior:'smooth',block:'center'})">Ver lista →</button></aside></section>`);
  });

  const f=document.getElementById('f'),o=document.getElementById('o'),q=document.getElementById('q'),n=document.getElementById('n');
  Object.entries(P).forEach(([k,v])=>f.add(new Option(v,k)));
  Object.entries(O).forEach(([k,v])=>o.add(new Option(v,k)));

  function run(){
    const t=q.value.toLowerCase().trim();
    let c=0;
    document.querySelectorAll('.it').forEach(e=>{
      const ok=(!t||e.dataset.s.includes(t))&&(!f.value||e.dataset.p==f.value)&&(!o.value||e.dataset.o==o.value);
      e.classList.toggle('hide',!ok);
      if(ok)c++;
    });
    document.querySelectorAll('.card').forEach(s=>s.classList.toggle('hide',!s.querySelector('.it:not(.hide)')));
    n.textContent=c+' de '+tot+' leads';
  }

  [q,f,o].forEach(e=>e.addEventListener('input',run));
  run();

  m.addEventListener('change',e=>{
    const it=e.target.closest('.it');
    if(!it)return;
    st[it.dataset.id]=e.target.checked;
    it.classList.toggle('done',e.target.checked);
    try{localStorage.setItem('rosebel',JSON.stringify(st))}catch(_){}
  });

  // Estrutura das 3 copys (Cialdini + Alex Hormozi + 90 segundos):
  // Versão 1: Reciprocidade + Hormozi ("SIM em 1 minuto")
  // Versão 2: Curiosidade ("o que a maioria só descobre na visita") + Escolha de 2 opções ("manhã ou tarde")
  // Versão 3: Qualificação ("Ainda de olho em apartamento?") + Resposta de 1 dígito ("1 ou 2")
  const T=[
  (n,e)=>`Oi, ${n}! Aqui é a Rosebel, da Lopes. 😊\n\nVi seu interesse no ${e} e separei pra você a tabela atualizada + uma simulação sob medida, grátis e sem compromisso.\n\nPosso te enviar agora? Responde só *SIM* que eu mando em 1 minuto. 🏡`,
  (n,e)=>`${n}, tudo bem? Rosebel, da Lopes. ☀️\n\nQuero te mostrar o que a maioria só descobre na visita: como a parcela do ${e} pode caber no seu bolso. Faço uma simulação rápida pra você, sem custo.\n\nMelhor pra você hoje: *manhã* ou *tarde*?`,
  (n,e)=>`Oi, ${n}! Rosebel, corretora da Lopes. 😉\n\nAinda está de olho em apartamento? Posso te mandar planta, valores e as unidades disponíveis do ${e} em 1 minuto, sem compromisso.\n\nPrefere receber por aqui ou uma ligação rápida? Responde *1* (aqui) ou *2* (ligação).`
  ];

  const VL=[
    'Versão 1 · Reciprocidade (SIM)',
    'Versão 2 · Curiosidade (Manhã / Tarde)',
    'Versão 3 · Qualificação (1 ou 2)'
  ];

  let cur=null;
  const ov=document.getElementById('ov'),mt=document.getElementById('mt'),mw=document.getElementById('mw'),mtag=document.getElementById('mtag');

  function show(){
    const{fn,e,v}=cur;
    const idx = (v % 3 + 3) % 3;
    mt.value=T[idx](fn,e);
    if(mtag) mtag.textContent = VL[idx];
    const ph=cur.it.dataset.ph;
    mw.style.display=ph?'':'none';
    upd();
  }
  function upd(){
    const ph=cur.it.dataset.ph;
    if(ph)mw.href='https://wa.me/55'+ph+'?text='+encodeURIComponent(mt.value);
  }

  m.addEventListener('click',ev=>{
    if(!ev.target.classList.contains('nm'))return;
    const it=ev.target.closest('.it'),nm=ev.target.textContent,w=(nm.match(/^\p{L}+/u)||[nm])[0];
    cur={it,fn:w[0].toUpperCase()+w.slice(1).toLowerCase(),e:P[it.dataset.p].split(' - ')[0],v:[...nm].reduce((a,c)=>a+c.charCodeAt(0),0)%3};
    document.getElementById('mh').textContent=nm;
    document.getElementById('mc').textContent='Copiar';
    show();
    ov.classList.add('on');
  });

  mt.addEventListener('input',upd);
  document.getElementById('mv').onclick=()=>{cur.v++;show()};
  document.getElementById('mc').onclick=async function(){
    try{await navigator.clipboard.writeText(mt.value)}catch(_){mt.select();document.execCommand('copy')}
    this.textContent='Copiado ✓';
  };
  const cl=()=>ov.classList.remove('on');
  document.getElementById('mx').onclick=cl;
  ov.addEventListener('click',ev=>{if(ev.target===ov)cl()});
  addEventListener('keydown',ev=>{if(ev.key=='Escape')cl()});
